    const SUPABASE_KEY =

    const supabase =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /*
     * =====================================================
     * ELEMENTOS
     * =====================================================
     */

    const fileInput =
        document.getElementById("fileInput");

    const fileInfo =
        document.getElementById("fileInfo");

    const sendButton =
        document.getElementById("sendButton");

    const status =
        document.getElementById("status");

    const downloadBox =
        document.getElementById("downloadBox");

    const downloadLink =
        document.getElementById("downloadLink");

    const copyButton =
        document.getElementById("copyButton");


    let selectedFile = null;


    /*
     * =====================================================
     * SELECIONAR ARQUIVO
     * =====================================================
     */

    fileInput.addEventListener("change", () => {

        selectedFile =
            fileInput.files[0];

        if (!selectedFile) {
            return;
        }

        fileInfo.style.display =
            "block";

        const tamanho =
            selectedFile.size;

        let tamanhoTexto;

        if (tamanho < 1024 * 1024) {

            tamanhoTexto =
                (tamanho / 1024).toFixed(2)
                + " KB";

        } else {

            tamanhoTexto =
                (tamanho / 1024 / 1024).toFixed(2)
                + " MB";
        }

        fileInfo.innerHTML = `
            <strong>
                ${escapeHtml(selectedFile.name)}
            </strong>

            <br><br>

            Tamanho: ${tamanhoTexto}

            <br>

            Tipo:
            ${escapeHtml(
                selectedFile.type ||
                "desconhecido"
            )}
        `;

        sendButton.style.display =
            "block";

        status.textContent = "";

        downloadBox.style.display =
            "none";
    });


    /*
     * =====================================================
     * ENVIAR
     * =====================================================
     */

    sendButton.addEventListener(
        "click",
        async () => {

            if (!selectedFile) {
                return;
            }

            sendButton.disabled =
                true;

            sendButton.textContent =
                "⏳ Enviando...";

            status.textContent =
                "Enviando arquivo...";


            const nomeUnico =
                crypto.randomUUID()
                + "-"
                + selectedFile.name;


            try {

                const resultado =
                    await supabase.storage
                        .from("files")
                        .upload(
                            nomeUnico,
                            selectedFile,
                            {
                                cacheControl: "3600",
                                upsert: false,
                                contentType:
                                    selectedFile.type ||
                                    "application/octet-stream"
                            }
                        );


                if (resultado.error) {
                    throw resultado.error;
                }


                const publicResult =
                    supabase.storage
                        .from("files")
                        .getPublicUrl(
                            nomeUnico
                        );


                const publicUrl =
                    publicResult.data.publicUrl;


                downloadLink.href =
                    publicUrl;


                downloadBox.style.display =
                    "block";


                status.textContent =
                    "✅ Arquivo enviado com sucesso!";


                sendButton.textContent =
                    "✅ Enviado";

                console.error(error);

                status.textContent =
                    "❌ Erro ao enviar: "
                    + error.message;

                sendButton.disabled =
                    false;

                sendButton.textContent =
                    "📤 Enviar arquivo";
            }

        }

                );

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text;

        return div.innerHTML;
    }

</script>
