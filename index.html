<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer Files</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: white;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .box {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    input[type="file"],
    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #0d0d0d;
      color: white;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #ffffff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      opacity: 0.85;
    }

    .info {
      margin-top: 15px;
      padding: 15px;
      background: #101010;
      border-radius: 10px;
      word-break: break-word;
    }

    .code {
      font-size: 30px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 5px;
      margin: 15px 0;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 20px 0;
      background: white;
      padding: 15px;
      border-radius: 10px;
    }

    #qrcode img,
    #qrcode canvas {
      max-width: 100%;
      height: auto;
    }

    .preview {
      margin-top: 20px;
      padding: 15px;
      background: #0b0b0b;
      border: 1px solid #292929;
      border-radius: 12px;
      text-align: center;
      overflow: hidden;
    }

    .preview-title {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .preview img {
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 8px;
    }

    .preview iframe {
      width: 100%;
      height: 500px;
      border: 0;
      border-radius: 8px;
      background: white;
    }

    .preview video {
      width: 100%;
      max-height: 500px;
      border-radius: 8px;
    }

    .preview audio {
      width: 100%;
    }

    .preview pre {
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 500px;
      overflow: auto;
      padding: 15px;
      background: #050505;
      border-radius: 8px;
    }

    .download {
      margin-top: 15px;
    }

    .secondary {
      margin-top: 10px;
      background: #292929;
      color: white;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #ff7070;
      margin-top: 10px;
    }

    .success {
      color: #72ff9a;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📁 Transfer Files</h1>

    <!-- ENVIAR -->
    <div class="box">
      <h2>Enviar arquivo</h2>

      <input type="file" id="fileInput">

      <div id="senderPreview" class="preview hidden"></div>

      <button onclick="enviarArquivo()">
        Enviar arquivo
      </button>

      <div id="uploadResult"></div>
    </div>


    <!-- RECEBER -->
    <div class="box">
      <h2>Receber arquivo</h2>

      <input
        type="text"
        id="codeInput"
        maxlength="8"
        placeholder="Digite o código"
      >

      <button onclick="buscarArquivo()">
        Encontrar arquivo
      </button>

      <div id="foundBox"></div>
    </div>

  </div>


<script>

  const SUPABASE_URL = "https://rmplwgtizbqzmvabrbhe.supabase.co";

  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtcGx3Z3RpemJxem12YWJyYmhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMDI5NzIsImV4cCI6MjEwNTY3ODk3Mn0.1Y23eINegprxaFa-HtttbJZsMgrT-Wmq1heTT54YaCw";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  let selectedFile = null;
  let localPreviewUrl = null;


  /*
    =====================================================
    PRÉ-VISUALIZAÇÃO DO ARQUIVO SELECIONADO
    =====================================================
  */

  document
    .getElementById("fileInput")
    .addEventListener("change", function () {

      selectedFile = this.files[0];

      if (!selectedFile) {
        return;
      }

      mostrarPreviewLocal(selectedFile);
    });


  function mostrarPreviewLocal(file) {

    const container = document.getElementById("senderPreview");

    if (localPreviewUrl) {
      URL.revokeObjectURL(localPreviewUrl);
      localPreviewUrl = null;
    }

    container.innerHTML = "";
    container.classList.remove("hidden");

    const titulo = document.createElement("div");
    titulo.className = "preview-title";
    titulo.textContent = "Pré-visualização";

    container.appendChild(titulo);

    localPreviewUrl = URL.createObjectURL(file);

    criarElementoPreview(
      container,
      localPreviewUrl,
      file.type,
      file.name
    );
  }


  /*
    =====================================================
    CRIA O PREVIEW
    =====================================================
  */

  function criarElementoPreview(container, url, type, fileName) {

    /*
      IMAGENS
      Inclui PNG, JPG, GIF, WEBP, SVG, BMP etc.
    */

    if (type.startsWith("image/")) {

      const img = document.createElement("img");

      img.src = url;
      img.alt = fileName;

      container.appendChild(img);

      return;
    }


    /*
      PDF
    */

    if (type === "application/pdf") {

      const iframe = document.createElement("iframe");

      iframe.src = url;
      iframe.title = fileName;

      container.appendChild(iframe);

      return;
    }


    /*
      VÍDEO
    */

    if (type.startsWith("video/")) {

      const video = document.createElement("video");

      video.src = url;
      video.controls = true;

      container.appendChild(video);

      return;
    }


    /*
      ÁUDIO
    */

    if (type.startsWith("audio/")) {

      const audio = document.createElement("audio");

      audio.src = url;
      audio.controls = true;

      container.appendChild(audio);

      return;
    }


    /*
      ARQUIVOS DE TEXTO
    */

    if (
      type === "text/plain" ||
      type === "text/csv"
    ) {

      const pre = document.createElement("pre");

      fetch(url)
        .then(response => response.text())
        .then(text => {

          pre.textContent = text;

        })
        .catch(() => {

          pre.textContent =
            "Não foi possível visualizar este arquivo.";

        });

      container.appendChild(pre);

      return;
    }


    /*
      FORMATO NÃO SUPORTADO PELO NAVEGADOR
    */

    const mensagem = document.createElement("div");

    mensagem.style.padding = "30px 10px";
    mensagem.innerHTML = `
      👁️ <strong>Prévia não disponível</strong>
      <br><br>
      Este tipo de arquivo precisa ser baixado
      para ser aberto.
    `;

    container.appendChild(mensagem);
  }


  /*
    =====================================================
    ENVIAR ARQUIVO
    =====================================================
  */

  async function enviarArquivo() {

    const result = document.getElementById("uploadResult");

    result.innerHTML = "";

    if (!selectedFile) {

      result.innerHTML =
        '<div class="error">Selecione um arquivo primeiro.</div>';

      return;
    }


    result.innerHTML =
      '<div>Enviando arquivo...</div>';


    try {

      /*
        ID único para o arquivo
      */

      const id = crypto.randomUUID();


      /*
        Mantém o nome original
      */

      const filePath =
        id + "/" + selectedFile.name;


      /*
        Envia o arquivo original.
        Nenhuma conversão ou compressão é feita.
      */

      const { error: uploadError } =
        await supabaseClient.storage
          .from("files")
          .upload(
            filePath,
            selectedFile,
            {
              contentType:
                selectedFile.type ||
                "application/octet-stream",

              upsert: false
            }
          );


      if (uploadError) {
        throw uploadError;
      }


      /*
        Cria código de 8 caracteres
      */

      const codigo =
        id
          .replace(/-/g, "")
          .substring(0, 8)
          .toUpperCase();


      /*
        Salva informações no banco
      */

      const { error: databaseError } =
        await supabaseClient
          .from("transfers")
          .insert({
            code: codigo,
            file_path: filePath,
            file_name: selectedFile.name,
            file_type:
              selectedFile.type ||
              "application/octet-stream",
            file_size: selectedFile.size
          });


      if (databaseError) {
        throw databaseError;
      }


      /*
        Link que será usado pelo QR Code
      */

      const pageUrl =
        window.location.origin +
        window.location.pathname +
        "?code=" +
        codigo;


      /*
        Mostra resultado
      */

      result.innerHTML = `
        <div class="info">

          <div class="success">
            Arquivo enviado com sucesso!
          </div>

          <div style="margin-top:12px">
            Código:
          </div>

          <div class="code">
            ${codigo}
          </div>

          <div id="qrcode"></div>

          <button
            class="secondary"
            onclick="copiarCodigo('${codigo}')"
          >
            Copiar código
          </button>

        </div>
      `;


      /*
        Gera QR Code
      */

      new QRCode(
        document.getElementById("qrcode"),
        {
          text: pageUrl,
          width: 220,
          height: 220
        }
      );

    }

    catch (error) {

      console.error(error);

      result.innerHTML = `
        <div class="error">
          Erro ao enviar arquivo:
          <br>
          ${error.message}
        </div>
      `;
    }
  }


  /*
    =====================================================
    BUSCAR ARQUIVO
    =====================================================
  */

  async function buscarArquivo() {

    const codigo =
      document
        .getElementById("codeInput")
        .value
        .trim()
        .toUpperCase();


    const foundBox =
      document.getElementById("foundBox");


    foundBox.innerHTML =
      "<div>Procurando arquivo...</div>";


    if (!codigo) {

      foundBox.innerHTML =
        '<div class="error">Digite um código.</div>';

      return;
    }


    try {

      /*
        Procura o código no banco
      */

      const { data, error } =
        await supabaseClient
          .from("transfers")
          .select("*")
          .eq("code", codigo)
          .single();


      if (error || !data) {

        foundBox.innerHTML =
          '<div class="error">Arquivo não encontrado.</div>';

        return;
      }


      /*
        Cria URL temporária para o arquivo.
        Ela funciona durante 24 horas.
      */

      const { data: signedData, error: signedError } =
        await supabaseClient.storage
          .from("files")
          .createSignedUrl(
            data.file_path,
            86400
          );


      if (signedError) {
        throw signedError;
      }


      const signedUrl =
        signedData.signedUrl;


      /*
        Mostra informações
      */

      foundBox.innerHTML = `
        <div class="info">

          <strong>${escapeHtml(data.file_name)}</strong>

          <br><br>

          Tamanho:
          ${formatBytes(data.file_size)}

          <div
            id="remotePreview"
            class="preview"
          >
            <div class="preview-title">
              Pré-visualização
            </div>
          </div>

          <button
            class="download"
            onclick="baixarArquivo(
              '${escapeAttribute(signedUrl)}',
              '${escapeAttribute(data.file_name)}'
            )"
          >
            ⬇️ Baixar arquivo
          </button>

        </div>
      `;


      /*
        Cria o preview usando a URL do Supabase
      */

      const preview =
        document.getElementById("remotePreview");


      criarElementoPreview(
        preview,
        signedUrl,
        data.file_type || "",
        data.file_name
      );

    }

    catch (error) {

      console.error(error);

      foundBox.innerHTML = `
        <div class="error">
          Erro ao encontrar arquivo:
          <br>
          ${error.message}
        </div>
      `;
    }
  }


  /*
    =====================================================
    DOWNLOAD
    =====================================================
  */

  async function baixarArquivo(url, fileName) {

    try {

      const response =
        await fetch(url);


      if (!response.ok) {
        throw new Error("Falha no download.");
      }


      const blob =
        await response.blob();


      const blobUrl =
        URL.createObjectURL(blob);


      const link =
        document.createElement("a");


      link.href = blobUrl;
      link.download = fileName;

      document.body.appendChild(link);

      link.click();

      link.remove();

      URL.revokeObjectURL(blobUrl);

    }

    catch (error) {

      console.error(error);

      /*
        Se o navegador bloquear o download automático,
        abre o arquivo normalmente.
      */

      window.open(url, "_blank");
    }
  }


  /*
    =====================================================
    COPIAR CÓDIGO
    =====================================================
  */

  function copiarCodigo(codigo) {

    navigator.clipboard
      .writeText(codigo)
      .then(() => {

        alert("Código copiado!");

      });
  }


  /*
    =====================================================
    TAMANHO DO ARQUIVO
    =====================================================
  */

  function formatBytes(bytes) {

    if (!bytes) {
      return "0 B";
    }

    const units = [
      "B",
      "KB",
      "MB",
      "GB",
      "TB"
    ];

    const index =
      Math.floor(
        Math.log(bytes) /
        Math.log(1024)
      );

    return (
      parseFloat(
        (bytes / Math.pow(1024, index))
          .toFixed(2)
      )
      + " "
      + units[index]
    );
  }


  /*
    =====================================================
    SEGURANÇA BÁSICA PARA TEXTO HTML
    =====================================================
  */

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  function escapeAttribute(text) {

    return String(text)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }


  /*
    =====================================================
    ABRIR AUTOMATICAMENTE PELO QR CODE
    =====================================================
  */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const codigoUrl =
    params.get("code");


  if (codigoUrl) {

    document
      .getElementById("codeInput")
      .value =
        codigoUrl.toUpperCase();


    setTimeout(() => {

      buscarArquivo();

    }, 500);
  }

</script>

</body>
</html>
