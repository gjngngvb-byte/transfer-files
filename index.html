  <!-- SUPABASE -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <script>

    /*
     * ==========================================
     * CONFIGURAÇÃO
     * ==========================================
     */

    const SUPABASE_URL =
      "https://rmplwgtizbqzmvabrbhe.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoicm1wbHdn dGl6YnF6bXZhYnJi aGUiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc5MDEwMjk3MiwiZXhwIjoyMTA1Njc4OTcyfQ.1Y23eINegprxaFa-HtttbJZsMgrT-Wmq1heTT54YaCw"
        .replaceAll(" ", "");


    /*
     * ==========================================
     * ELEMENTOS
     * ==========================================
     */

    const fileInput =
      document.getElementById("fileInput");

    const fileInfo =
      document.getElementById("fileInfo");

    const sendButton =
      document.getElementById("sendButton");

    const status =
      document.getElementById("status");

    const resultBox =
      document.getElementById("resultBox");

    const transferCode =
      document.getElementById("transferCode");

    const downloadLink =
      document.getElementById("downloadLink");

    const copyButton =
      document.getElementById("copyButton");


    let selectedFile = null;


    /*
     * ==========================================
     * SUPABASE
     * ==========================================
     */

    let supabaseClient = null;


    function iniciarSupabase() {

      try {

        if (
          typeof window.supabase === "undefined"
        ) {

          console.error(
            "Supabase não foi carregado."
          );

          return false;
        }


        supabaseClient =
          window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
          );


        console.log(
          "Supabase conectado."
        );

        return true;

      } catch (error) {

        console.error(
          "Erro ao iniciar Supabase:",
          error
        );

        return false;
      }
    }


    iniciarSupabase();


    /*
     * ==========================================
     * ESCOLHER ARQUIVO
     * ==========================================
     */

    fileInput.addEventListener(
      "change",
      function () {

        selectedFile =
          fileInput.files[0];


        if (!selectedFile) {

          return;
        }


        /*
         * MOSTRA AS INFORMAÇÕES
         */

        fileInfo.style.display =
          "block";


        let tamanho =
          selectedFile.size;


        let tamanhoTexto;


        if (
          tamanho < 1024 * 1024
        ) {

          tamanhoTexto =
            (tamanho / 1024).toFixed(2)
            + " KB";

        } else {

          tamanhoTexto =
            (tamanho / 1024 / 1024).toFixed(2)
            + " MB";
        }


        fileInfo.innerHTML = `

          <strong>
            ${escapeHtml(selectedFile.name)}
          </strong>

          <br><br>

          Tamanho:
          ${tamanhoTexto}

          <br>

          Tipo:
          ${escapeHtml(
            selectedFile.type ||
            "desconhecido"
          )}

        `;


        /*
         * MOSTRA O BOTÃO
         */

        sendButton.style.display =
          "block";


        /*
         * LIMPA ESTADO ANTERIOR
         */

        resultBox.style.display =
          "none";

        status.textContent =
          "Arquivo pronto para envio.";

        status.className = "";

      }
    );


    /*
     * ==========================================
     * ENVIAR ARQUIVO
     * ==========================================
     */

    sendButton.addEventListener(
      "click",
      async function () {

        if (!selectedFile) {

          return;
        }


        if (!supabaseClient) {

          status.textContent =
            "❌ Supabase não foi carregado.";

          status.className =
            "error";

          return;
        }


        sendButton.disabled =
          true;

        sendButton.textContent =
          "⏳ Enviando...";

        status.textContent =
          "Enviando arquivo...";

        status.className = "";


        try {

          /*
           * GERA UM ID ÚNICO
           */

          const id =
            crypto.randomUUID();


          /*
           * NOME DO ARQUIVO NO STORAGE
           */

          const caminho =
            id +
            "/" +
            selectedFile.name;


          console.log(
            "Enviando:",
            caminho
          );


          /*
           * ENVIA OS BYTES ORIGINAIS
           *
           * O arquivo não é convertido.
           * Não é comprimido.
           * Não é redimensionado.
           */

          const resultado =
            await supabaseClient
              .storage
              .from("files")
              .upload(
                caminho,
                selectedFile,
                {
                  cacheControl: "3600",

                  upsert: false,

                  contentType:
                    selectedFile.type ||
                    "application/octet-stream"
                }
              );


          if (resultado.error) {

            throw resultado.error;
          }


          /*
           * GERA LINK TEMPORÁRIO
           *
           * Válido por 1 hora.
           */

          const signed =
            await supabaseClient
              .storage
              .from("files")
              .createSignedUrl(
                caminho,
                3600
              );


          if (signed.error) {

            throw signed.error;
          }


          const url =
            signed.data.signedUrl;


          /*
           * CRIA CÓDIGO
           */

          const codigo =
            id.substring(0, 8)
              .toUpperCase();


          transferCode.textContent =
            codigo;


          downloadLink.href =
            url;


          resultBox.style.display =
            "block";


          status.textContent =
            "✅ Arquivo enviado com sucesso!";

          status.className =
            "success";


          sendButton.textContent =
            "✅ Enviado";


          console.log(
            "Arquivo enviado:",
            caminho
          );

        } catch (error) {

          console.error(
            "Erro no envio:",
            error
          );


          status.textContent =
            "❌ Erro ao enviar: " +
            (
              error.message ||
              "Erro desconhecido"
            );

          status.className =
            "error";


          sendButton.disabled =
            false;

          sendButton.textContent =
            "📤 Enviar arquivo";
        }

      }
    );


    /*
     * ==========================================
     * COPIAR LINK
     * ==========================================
     */

    copyButton.addEventListener(
      "click",
      async function () {

        try {

          await navigator.clipboard.writeText(
            downloadLink.href
          );


          copyButton.textContent =
            "✅ Link copiado!";


          setTimeout(
            function () {

              copyButton.textContent =
                "📋 Copiar link";

            },
            2000
          );


        } catch (error) {

          alert(
            "Não foi possível copiar o link."
          );

        }

      }
    );


    /*
     * ==========================================
     * SEGURANÇA DO NOME
     * ==========================================
     */

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text;

      return div.innerHTML;
    }


    /*
     * ==========================================
     * TESTE
     * ==========================================
     */

    console.log(
      "Transfer Files carregado."
    );

  </script>

</body>
</html>
