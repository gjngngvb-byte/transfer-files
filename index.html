<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer Files</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0f0f12;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 42px;
    }

    .subtitle {
      margin: 12px 0 30px;
      color: #999;
      line-height: 1.5;
    }

    .upload-area {
      display: block;
      padding: 45px 20px;
      border: 2px dashed #444;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload-area:hover {
      border-color: #8b5cf6;
      background: #15151b;
    }

    .upload-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .upload-text {
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .select-button {
      display: inline-block;
      padding: 14px 25px;
      border-radius: 12px;
      background: #8b5cf6;
      font-weight: bold;
    }

    input[type="file"] {
      display: none;
    }

    #fileInfo {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: #18181d;
      text-align: left;
      word-break: break-word;
    }

    #sendButton {
      display: none;
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #8b5cf6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #sendButton:hover {
      background: #7446d8;
    }

    #sendButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      min-height: 25px;
      margin-top: 20px;
      color: #aaa;
    }

    .success {
      color: #22c55e !important;
    }

    .error {
      color: #ef4444 !important;
    }

    #resultBox {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 14px;
      background: #18181d;
    }

    .code {
      margin: 15px 0;
      padding: 15px;
      border-radius: 12px;
      background: #0f0f12;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    #downloadLink {
      display: inline-block;
      margin-top: 10px;
      padding: 13px 20px;
      border-radius: 12px;
      background: #22c55e;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .copy-button {
      margin-top: 10px;
      padding: 10px 15px;
      border: 1px solid #444;
      border-radius: 10px;
      background: transparent;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Transfer Files</h1>

    <p class="subtitle">
      Envie um arquivo de um dispositivo<br>
      e baixe exatamente o mesmo arquivo em outro.
    </p>

    <label class="upload-area">

      <div class="upload-icon">📁</div>

      <div class="upload-text">
        Escolha um arquivo
      </div>

      <div class="select-button">
        Selecionar arquivo
      </div>

      <input
        type="file"
        id="fileInput"
      >

    </label>

    <div id="fileInfo"></div>

    <button id="sendButton">
      📤 Enviar arquivo
    </button>

    <div id="status"></div>

    <div id="resultBox">

      <strong>✅ Arquivo enviado!</strong>

      <p>
        Link para abrir no outro dispositivo:
      </p>

      <div
        id="transferCode"
        class="code">
      </div>

      <a
        id="downloadLink"
        href="#"
        target="_blank"
        rel="noopener">
        📥 Baixar arquivo
      </a>

      <br>

      <button
        id="copyButton"
        class="copy-button">
        📋 Copiar link
      </button>

    </div>

  </main>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://rmplwgtizbqzmvabrbhe.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtcGx3Z3RpemJxem12YWJyYmhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMDI5NzIsImV4cCI6MjEwNTY3ODk3Mn0.1Y23eINegprxaFa-HtttbJZsMgrT-Wmq1heTT54YaCw";


    /*
     * SUPABASE
     */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /*
     * ELEMENTOS
     */

    const fileInput =
      document.getElementById("fileInput");

    const fileInfo =
      document.getElementById("fileInfo");

    const sendButton =
      document.getElementById("sendButton");

    const status =
      document.getElementById("status");

    const resultBox =
      document.getElementById("resultBox");

    const transferCode =
      document.getElementById("transferCode");

    const downloadLink =
      document.getElementById("downloadLink");

    const copyButton =
      document.getElementById("copyButton");


    let selectedFile = null;


    /*
     * ESCOLHER ARQUIVO
     */

    fileInput.addEventListener(
      "change",
      function () {

        selectedFile =
          fileInput.files[0];

        if (!selectedFile) {
          return;
        }


        let tamanho =
          selectedFile.size;

        let tamanhoTexto;


        if (tamanho < 1024 * 1024) {

          tamanhoTexto =
            (tamanho / 1024).toFixed(2) +
            " KB";

        } else {

          tamanhoTexto =
            (tamanho / 1024 / 1024).toFixed(2) +
            " MB";
        }


        fileInfo.innerHTML = `
          <strong>${escapeHtml(selectedFile.name)}</strong>
          <br><br>
          Tamanho: ${tamanhoTexto}
          <br>
          Tipo: ${escapeHtml(
            selectedFile.type ||
            "desconhecido"
          )}
        `;


        fileInfo.style.display =
          "block";


        sendButton.style.display =
          "block";


        sendButton.disabled =
          false;


        sendButton.textContent =
          "📤 Enviar arquivo";


        resultBox.style.display =
          "none";


        status.textContent =
          "Arquivo pronto para envio.";

        status.className = "";

      }
    );


    /*
     * ENVIAR
     */

    sendButton.addEventListener(
      "click",
      async function () {

        if (!selectedFile) {
          return;
        }


        sendButton.disabled =
          true;

        sendButton.textContent =
          "⏳ Enviando...";


        status.textContent =
          "Enviando arquivo...";

        status.className = "";


        try {

          /*
           * ID ÚNICO
           */

          const id =
            crypto.randomUUID();


          /*
           * CAMINHO DO ARQUIVO
           */

          const caminho =
            id + "/" + selectedFile.name;


          console.log(
            "Enviando:",
            caminho
          );


          /*
           * UPLOAD
           */

          const upload =
            await supabaseClient
              .storage
              .from("files")
              .upload(
                caminho,
                selectedFile,
                {
                  cacheControl: "3600",
                  upsert: false,
                  contentType:
                    selectedFile.type ||
                    "application/octet-stream"
                }
              );


          if (upload.error) {
            throw upload.error;
          }


          console.log(
            "Upload concluído."
          );


          /*
           * LINK TEMPORÁRIO
           *
           * 24 HORAS
           */

          const signed =
            await supabaseClient
              .storage
              .from("files")
              .createSignedUrl(
                caminho,
                86400
              );


          if (signed.error) {
            throw signed.error;
          }


          const url =
            signed.data.signedUrl;


          /*
           * CÓDIGO
           */

          const codigo =
            id
              .replaceAll("-", "")
              .substring(0, 8)
              .toUpperCase();


          transferCode.textContent =
            codigo;


          downloadLink.href =
            url;


          resultBox.style.display =
            "block";


          status.textContent =
            "✅ Arquivo enviado com sucesso!";

          status.className =
            "success";


          sendButton.textContent =
            "✅ Enviado";


          console.log(
            "Link criado:",
            url
          );

        } catch (error) {

          console.error(
            "Erro no envio:",
            error
          );


          status.textContent =
            "❌ " +
            (
              error.message ||
              "Erro desconhecido"
            );

          status.className =
            "error";


          sendButton.disabled =
            false;


          sendButton.textContent =
            "📤 Enviar arquivo";
        }

      }
    );


    /*
     * COPIAR LINK
     */

    copyButton.addEventListener(
      "click",
      async function () {

        try {

          await navigator.clipboard.writeText(
            downloadLink.href
          );


          copyButton.textContent =
            "✅ Link copiado!";


          setTimeout(
            function () {

              copyButton.textContent =
                "📋 Copiar link";

            },
            2000
          );

        } catch (error) {

          alert(
            "Não foi possível copiar o link."
          );
        }

      }
    );


    /*
     * EVITA HTML INJETADO
     */

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text;

      return div.innerHTML;
    }


    console.log(
      "Transfer Files iniciado corretamente."
    );

  </script>

</body>
</html>
