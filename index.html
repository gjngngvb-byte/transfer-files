<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transfer Files</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #0f0f12;
            color: white;
        }

        .container {
            width: min(90%, 520px);
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            color: #999;
            margin-bottom: 30px;
        }

        .upload {
            display: block;
            border: 2px dashed #444;
            border-radius: 20px;
            padding: 50px 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload:hover {
            border-color: #8b5cf6;
            background: #15151b;
        }

        .upload span {
            display: block;
            font-size: 50px;
            margin-bottom: 15px;
        }

        input {
            display: none;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            border-radius: 12px;
            background: #8b5cf6;
            color: white;
            font-weight: bold;
        }

        .file {
            margin-top: 25px;
            padding: 20px;
            background: #18181d;
            border-radius: 12px;
            display: none;
        }

        .status {
            margin-top: 20px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Transfer Files</h1>

        <p>
            Transfira arquivos entre seus dispositivos.
        </p>

        <label class="upload">

            <span>📁</span>

            <strong>Escolha um arquivo</strong>

            <div class="button">
                Selecionar arquivo
            </div>

            <input type="file" id="fileInput">

        </label>

        <div class="file" id="fileInfo"></div>

        <div class="status" id="status"></div>

    </main>

    <script>

        const SUPABASE_URL =
            "https://rmplwgtizbqzmvabrbhe.supabase.co/rest/v1/";

        const SUPABASE_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtcGx3Z3RpemJxem12YWJyYmhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMDI5NzIsImV4cCI6MjEwNTY3ODk3Mn0.1Y23eINegprxaFa-HtttbJZsMgrT-Wmq1heTT54YaCw";

        const supabase = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const input = document.getElementById("fileInput");
        const fileInfo = document.getElementById("fileInfo");
        const status = document.getElementById("status");

        input.addEventListener("change", async () => {

            const file = input.files[0];

            if (!file) return;

            fileInfo.style.display = "block";

            fileInfo.innerHTML = `
                <strong>${file.name}</strong>
                <br>
                ${(file.size / 1024 / 1024).toFixed(2)} MB
            `;

            status.textContent = "Enviando arquivo...";

            const nomeUnico =
                crypto.randomUUID() + "-" + file.name;

            const { data, error } =
                await supabase.storage
                    .from("files")
                    .upload(nomeUnico, file);

            if (error) {

                console.error(error);

                status.textContent =
                    "Erro ao enviar: " + error.message;

                return;
            }

            status.textContent =
                "Arquivo enviado com sucesso!";

            console.log(data);

        });

    </script>

</body>
</html>
