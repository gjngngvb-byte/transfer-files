  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /*
     * ==========================================
     * SUPABASE
     * ==========================================
     */

    const SUPABASE_URL =
      "https://rmplwgtizbqzmvabrbhe.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtcGx3Z3RpemJxem12YWJyYmhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMDI5NzIsImV4cCI6MjEwNTY3ODk3Mn0.1Y23eINegprxaFa-HtttbJZsMgrT-Wmq1heTT54YaCw";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /*
     * ==========================================
     * ELEMENTOS
     * ==========================================
     */

    const fileInput =
      document.getElementById("fileInput");

    const fileInfo =
      document.getElementById("fileInfo");

    const sendButton =
      document.getElementById("sendButton");

    const status =
      document.getElementById("status");

    const resultBox =
      document.getElementById("resultBox");

    const transferCode =
      document.getElementById("transferCode");

    const downloadButton =
      document.getElementById("downloadButton");

    const copyButton =
      document.getElementById("copyButton");

    const linkBox =
      document.getElementById("linkBox");


    let selectedFile = null;

    let downloadUrl = null;

    let originalFileName = null;


    /*
     * ==========================================
     * ESCOLHER ARQUIVO
     * ==========================================
     */

    fileInput.addEventListener(
      "change",
      function () {

        selectedFile =
          fileInput.files[0];


        if (!selectedFile) {
          return;
        }


        let tamanho =
          selectedFile.size;


        let tamanhoTexto;


        if (
          tamanho < 1024 * 1024
        ) {

          tamanhoTexto =
            (tamanho / 1024).toFixed(2)
            + " KB";

        } else {

          tamanhoTexto =
            (tamanho / 1024 / 1024).toFixed(2)
            + " MB";
        }


        fileInfo.innerHTML = `

          <strong>
            ${escapeHtml(
              selectedFile.name
            )}
          </strong>

          <br><br>

          Tamanho:
          ${tamanhoTexto}

          <br>

          Tipo:
          ${escapeHtml(
            selectedFile.type ||
            "desconhecido"
          )}

        `;


        fileInfo.style.display =
          "block";


        sendButton.style.display =
          "block";


        sendButton.disabled =
          false;


        sendButton.textContent =
          "📤 Enviar arquivo";


        resultBox.style.display =
          "none";


        status.textContent =
          "Arquivo pronto para envio.";

        status.className = "";

      }
    );


    /*
     * ==========================================
     * ENVIAR ARQUIVO
     * ==========================================
     */

    sendButton.addEventListener(
      "click",
      async function () {

        if (!selectedFile) {
          return;
        }


        sendButton.disabled =
          true;

        sendButton.textContent =
          "⏳ Enviando...";


        status.textContent =
          "Enviando arquivo...";


        try {

          /*
           * ID ÚNICO
           */

          const id =
            crypto.randomUUID();


          /*
           * CAMINHO
           */

          const caminho =
            id +
            "/" +
            selectedFile.name;


          originalFileName =
            selectedFile.name;


          console.log(
            "Enviando:",
            caminho
          );


          /*
           * UPLOAD
           */

          const upload =
            await supabaseClient
              .storage
              .from("files")
              .upload(
                caminho,
                selectedFile,
                {
                  cacheControl: "3600",
                  upsert: false,
                  contentType:
                    selectedFile.type ||
                    "application/octet-stream"
                }
              );


          if (upload.error) {
            throw upload.error;
          }


          console.log(
            "Upload concluído."
          );


          /*
           * LINK TEMPORÁRIO
           */

          const signed =
            await supabaseClient
              .storage
              .from("files")
              .createSignedUrl(
                caminho,
                86400
              );


          if (signed.error) {
            throw signed.error;
          }


          downloadUrl =
            signed.data.signedUrl;


          /*
           * CÓDIGO
           */

          const codigo =
            id
              .replaceAll("-", "")
              .substring(0, 8)
              .toUpperCase();


          transferCode.textContent =
            codigo;


          /*
           * MOSTRA LINK
           */

          linkBox.textContent =
            downloadUrl;


          /*
           * MOSTRA RESULTADO
           */

          resultBox.style.display =
            "block";


          status.textContent =
            "✅ Arquivo enviado com sucesso!";


          status.className =
            "success";


          sendButton.textContent =
            "✅ Enviado";


          console.log(
            "Link:",
            downloadUrl
          );

        } catch (error) {

          console.error(
            "Erro no envio:",
            error
          );


          status.textContent =
            "❌ " +
            (
              error.message ||
              "Erro desconhecido"
            );


          status.className =
            "error";


          sendButton.disabled =
            false;


          sendButton.textContent =
            "📤 Enviar arquivo";
        }

      }
    );


    /*
     * ==========================================
     * DOWNLOAD DIRETO
     * ==========================================
     */

    downloadButton.addEventListener(
      "click",
      async function () {

        if (!downloadUrl) {
          return;
        }


        downloadButton.disabled =
          true;


        downloadButton.textContent =
          "⏳ Baixando...";


        try {

          /*
           * PEGA O ARQUIVO
           */

          const resposta =
            await fetch(
              downloadUrl
            );


          if (!resposta.ok) {

            throw new Error(
              "Não foi possível baixar o arquivo."
            );
          }


          /*
           * TRANSFORMA EM BLOB
           */

          const blob =
            await resposta.blob();


          /*
           * CRIA DOWNLOAD LOCAL
           */

          const blobUrl =
            URL.createObjectURL(
              blob
            );


          const link =
            document.createElement("a");


          link.href =
            blobUrl;


          link.download =
            originalFileName ||
            "arquivo";


          document.body.appendChild(
            link
          );


          link.click();


          link.remove();


          /*
           * LIBERA MEMÓRIA
           */

          setTimeout(
            function () {

              URL.revokeObjectURL(
                blobUrl
              );

            },
            1000
          );


          downloadButton.textContent =
            "✅ Baixado!";


        } catch (error) {

          console.error(
            "Erro no download:",
            error
          );


          /*
           * FALLBACK
           */

          window.open(
            downloadUrl,
            "_blank"
          );


          downloadButton.textContent =
            "📥 Baixar arquivo";

        }


        setTimeout(
          function () {

            downloadButton.disabled =
              false;

            downloadButton.textContent =
              "📥 Baixar arquivo";

          },
          2000
        );

      }
    );


    /*
     * ==========================================
     * COPIAR LINK
     * ==========================================
     */

    copyButton.addEventListener(
      "click",
      async function () {

        if (!downloadUrl) {
          return;
        }


        try {

          await navigator.clipboard.writeText(
            downloadUrl
          );


          copyButton.textContent =
            "✅ Link copiado!";


          setTimeout(
            function () {

              copyButton.textContent =
                "📋 Copiar link";

            },
            2000
          );


        } catch (error) {

          alert(
            "Não foi possível copiar o link."
          );

        }

      }
    );


    /*
     * ==========================================
     * ESCAPE HTML
     * ==========================================
     */

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text;

      return div.innerHTML;
    }


    console.log(
      "Transfer Files iniciado."
    );

  </script>

</body>
</html>
