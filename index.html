<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer Files</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-base: #030407;
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-border: rgba(255, 255, 255, 0.06);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      --accent-solid: #3b82f6;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --error: #ef4444;
      --input-bg: rgba(0, 0, 0, 0.2);
      --input-border: rgba(255, 255, 255, 0.1);
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 60px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Aurora Background Effect */
    body::before, body::after {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      opacity: 0.4;
      pointer-events: none;
    }
    
    body::before {
      top: -100px;
      left: -100px;
      background: radial-gradient(circle, rgba(59,130,246,0.3) 0%, transparent 70%);
    }

    body::after {
      bottom: -100px;
      right: -100px;
      background: radial-gradient(circle, rgba(139,92,246,0.3) 0%, transparent 70%);
    }

    .container {
      width: 100%;
      max-width: 640px;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      font-size: 32px;
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 36px;
      letter-spacing: -0.04em;
      font-weight: 800;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 400;
    }

    .box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px;
      margin-bottom: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
      transition: border-color 0.3s ease;
    }
    
    .box:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    .box h2 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .description {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    input[type="file"] {
      width: 100%;
      padding: 24px 20px;
      border-radius: 16px;
      border: 2px dashed var(--input-border);
      background: var(--input-bg);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      margin-bottom: 16px;
    }

    input[type="file"]:hover {
      border-color: rgba(59, 130, 246, 0.5);
      background: rgba(59, 130, 246, 0.05);
      color: var(--text-main);
    }

    input[type="file"]::file-selector-button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      margin-right: 16px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    
    input[type="file"]::file-selector-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    input[type="text"] {
      width: 100%;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
      text-align: center;
      outline: none;
      transition: all 0.3s ease;
      margin-bottom: 16px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }

    input[type="text"]:focus {
      border-color: var(--accent-solid);
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15), inset 0 2px 4px rgba(0,0,0,0.2);
    }

    input::placeholder {
      color: rgba(255,255,255,0.2);
      letter-spacing: 2px;
      font-weight: 500;
    }

    button {
      width: 100%;
      padding: 18px;
      border: 0;
      border-radius: 16px;
      background: var(--accent-gradient);
      color: white;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      filter: brightness(1.1);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
    }

    .secondary {
      margin-top: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      box-shadow: none;
      color: var(--text-main);
    }

    .secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: none;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .info {
      margin-top: 24px;
      padding: 24px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      word-break: break-word;
      text-align: center;
    }

    .info strong {
      font-size: 16px;
      color: var(--text-main);
    }

    .code {
      margin: 20px 0;
      padding: 20px;
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #fff;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 16px;
      text-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      width: fit-content;
      margin: 24px auto;
      padding: 16px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }

    #qrcode img, #qrcode canvas {
      display: block;
      border-radius: 8px;
    }

    .preview {
      margin: 24px 0;
      padding: 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      text-align: center;
      overflow: hidden;
    }

    .preview-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
    }

    .preview img, .preview video {
      display: block;
      max-width: 100%;
      max-height: 400px;
      margin: auto;
      object-fit: contain;
      border-radius: 12px;
      background: rgba(0,0,0,0.5);
    }

    .preview iframe {
      display: block;
      width: 100%;
      height: 400px;
      border: 0;
      border-radius: 12px;
      background: white;
    }

    .preview audio {
      width: 100%;
      height: 48px;
      border-radius: 24px;
    }

    .preview pre {
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 400px;
      overflow: auto;
      padding: 20px;
      margin: 0;
      background: #09090b;
      border-radius: 12px;
      color: #d4d4d8;
      font-size: 13px;
      line-height: 1.6;
      border: 1px solid var(--card-border);
    }

    .success {
      color: var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      padding: 8px;
      background: rgba(16, 185, 129, 0.1);
      border-radius: 8px;
    }

    .error {
      color: var(--error);
      margin-top: 16px;
      font-size: 14px;
      text-align: center;
      padding: 12px;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 12px;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .hidden {
      display: none;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      body {
        padding: 30px 16px;
      }
      header {
        margin-bottom: 32px;
      }
      h1 {
        font-size: 28px;
      }
      .box {
        padding: 24px;
        border-radius: 20px;
      }
      .code {
        font-size: 26px;
        letter-spacing: 5px;
      }
      .preview iframe {
        height: 300px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">
        📁
      </div>
      <h1>Transfer Files</h1>
      <div class="subtitle">
        Envie arquivos de um dispositivo para outro
      </div>
    </header>


    <!-- ENVIAR -->
    <div class="box">
      <h2>Enviar arquivo</h2>
      <div class="description">
        Selecione um arquivo para gerar um código de transferência.
      </div>

      <input
        type="file"
        id="fileInput"
      >

      <div
        id="senderPreview"
        class="preview hidden"
      ></div>

      <button onclick="enviarArquivo()">
        Enviar arquivo
      </button>

      <div id="uploadResult"></div>
    </div>


    <!-- RECEBER -->
    <div class="box">
      <h2>Receber arquivo</h2>
      <div class="description">
        Digite o código recebido ou abra o link do QR Code.
      </div>

      <input
        type="text"
        id="codeInput"
        maxlength="8"
        placeholder="CÓDIGO"
      >

      <button onclick="buscarArquivo()">
        Encontrar arquivo
      </button>

      <div id="foundBox"></div>
    </div>

  </div>

<script>

  const SUPABASE_URL = "https://rmplwgtizbqzmvabrbhe.supabase.co";

  /*
    MANTENHA A MESMA SUPABASE_KEY
    QUE JÁ ESTÁ FUNCIONANDO NO SEU ARQUIVO ATUAL.
  */

  const SUPABASE_KEY = "SUA_CHAVE_ANON_PUBLIC_AQUI";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  let selectedFile = null;
  let localPreviewUrl = null;


  /*
    =====================================================
    PRÉ-VISUALIZAÇÃO DO ARQUIVO SELECIONADO
    =====================================================
  */

  document
    .getElementById("fileInput")
    .addEventListener("change", function () {

      selectedFile = this.files[0];

      if (!selectedFile) {
        return;
      }

      mostrarPreviewLocal(selectedFile);
    });


  function mostrarPreviewLocal(file) {

    const container =
      document.getElementById("senderPreview");

    if (localPreviewUrl) {

      URL.revokeObjectURL(localPreviewUrl);

      localPreviewUrl = null;
    }

    container.innerHTML = "";

    container.classList.remove("hidden");

    const titulo =
      document.createElement("div");

    titulo.className = "preview-title";

    titulo.innerHTML =
      "👁️ Pré-visualização";

    container.appendChild(titulo);

    localPreviewUrl =
      URL.createObjectURL(file);

    criarElementoPreview(
      container,
      localPreviewUrl,
      file.type,
      file.name
    );
  }


  /*
    =====================================================
    CRIA O PREVIEW
    =====================================================
  */

  function criarElementoPreview(
    container,
    url,
    type,
    fileName
  ) {

    if (type.startsWith("image/")) {

      const img =
        document.createElement("img");

      img.src = url;
      img.alt = fileName;

      container.appendChild(img);

      return;
    }


    if (type === "application/pdf") {

      const iframe =
        document.createElement("iframe");

      iframe.src = url;
      iframe.title = fileName;

      container.appendChild(iframe);

      return;
    }


    if (type.startsWith("video/")) {

      const video =
        document.createElement("video");

      video.src = url;
      video.controls = true;

      container.appendChild(video);

      return;
    }


    if (type.startsWith("audio/")) {

      const audio =
        document.createElement("audio");

      audio.src = url;
      audio.controls = true;

      container.appendChild(audio);

      return;
    }


    if (
      type === "text/plain" ||
      type === "text/csv"
    ) {

      const pre =
        document.createElement("pre");

      fetch(url)
        .then(response => response.text())
        .then(text => {

          pre.textContent = text;

        })
        .catch(() => {

          pre.textContent =
            "Não foi possível visualizar este arquivo.";

        });

      container.appendChild(pre);

      return;
    }


    const mensagem =
      document.createElement("div");

    mensagem.style.padding = "30px 10px";

    mensagem.style.color = "#8c929f";

    mensagem.innerHTML = `
      <div style="font-size:28px;margin-bottom:10px">
        📦
      </div>

      <strong style="color:#e7e9ee">
        Prévia não disponível
      </strong>

      <br><br>

      Este tipo de arquivo precisa ser baixado
      para ser aberto.
    `;

    container.appendChild(mensagem);
  }


  /*
    =====================================================
    ENVIAR ARQUIVO
    =====================================================
  */

  async function enviarArquivo() {

    const result =
      document.getElementById("uploadResult");

    result.innerHTML = "";

    if (!selectedFile) {

      result.innerHTML =
        '<div class="error">Selecione um arquivo primeiro.</div>';

      return;
    }

    result.innerHTML =
      '<div style="margin-top:14px;color:#8c929f;text-align:center;">Enviando arquivo...</div>';


    try {

      const id =
        crypto.randomUUID();

      const filePath =
        id + "/" + selectedFile.name;


      const {
        error: uploadError
      } =
        await supabaseClient.storage
          .from("files")
          .upload(
            filePath,
            selectedFile,
            {
              contentType:
                selectedFile.type ||
                "application/octet-stream",

              upsert: false
            }
          );


      if (uploadError) {
        throw uploadError;
      }


      const codigo =
        id
          .replace(/-/g, "")
          .substring(0, 8)
          .toUpperCase();


      const {
        error: databaseError
      } =
        await supabaseClient
          .from("transfers")
          .insert({
            code: codigo,
            file_path: filePath,
            file_name: selectedFile.name,
            file_type:
              selectedFile.type ||
              "application/octet-stream",
            file_size: selectedFile.size
          });


      if (databaseError) {
        throw databaseError;
      }


      const pageUrl =
        window.location.origin +
        window.location.pathname +
        "?code=" +
        codigo;


      result.innerHTML = `

        <div class="info">

          <div class="success">
            ✓ Arquivo enviado com sucesso
          </div>

          <div
            style="
              margin-top:18px;
              color:#8c929f;
              font-size:12px;
              text-transform:uppercase;
              letter-spacing:1px;
            "
          >
            Código de transferência
          </div>

          <div class="code">
            ${codigo}
          </div>

          <div id="qrcode"></div>

          <button
            class="secondary"
            onclick="copiarCodigo('${codigo}')"
          >
            Copiar código
          </button>

        </div>
      `;


      new QRCode(
        document.getElementById("qrcode"),
        {
          text: pageUrl,
          width: 220,
          height: 220,
          colorDark: "#000000",
          colorLight: "#ffffff"
        }
      );

    }

    catch (error) {

      console.error(error);

      result.innerHTML = `
        <div class="error">
          Erro ao enviar arquivo:
          <br>
          ${error.message}
        </div>
      `;
    }
  }


  /*
    =====================================================
    BUSCAR ARQUIVO
    =====================================================
  */

  async function buscarArquivo() {

    const codigo =
      document
        .getElementById("codeInput")
        .value
        .trim()
        .toUpperCase();


    const foundBox =
      document.getElementById("foundBox");


    foundBox.innerHTML =
      '<div style="margin-top:14px;color:#8c929f;text-align:center;">Procurando arquivo...</div>';


    if (!codigo) {

      foundBox.innerHTML =
        '<div class="error">Digite um código.</div>';

      return;
    }


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("transfers")
          .select("*")
          .eq("code", codigo)
          .single();


      if (error || !data) {

        foundBox.innerHTML =
          '<div class="error">Arquivo não encontrado.</div>';

        return;
      }


      const {
        data: signedData,
        error: signedError
      } =
        await supabaseClient.storage
          .from("files")
          .createSignedUrl(
            data.file_path,
            86400
          );


      if (signedError) {
        throw signedError;
      }


      const signedUrl =
        signedData.signedUrl;


      foundBox.innerHTML = `

        <div class="info">

          <strong>
            ${escapeHtml(data.file_name)}
          </strong>

          <div
            style="
              margin-top:7px;
              color:#777e8a;
              font-size:12px;
            "
          >
            ${formatBytes(data.file_size)}
          </div>

          <div
            id="remotePreview"
            class="preview"
          >

            <div class="preview-title">
              👁️ Pré-visualização
            </div>

          </div>

          <button
            class="download"
            onclick="baixarArquivo(
              '${escapeAttribute(signedUrl)}',
              '${escapeAttribute(data.file_name)}'
            )"
          >
            ⬇️ Baixar arquivo
          </button>

        </div>
      `;


      const preview =
        document.getElementById(
          "remotePreview"
        );


      criarElementoPreview(
        preview,
        signedUrl,
        data.file_type || "",
        data.file_name
      );

    }

    catch (error) {

      console.error(error);

      foundBox.innerHTML = `
        <div class="error">
          Erro ao encontrar arquivo:
          <br>
          ${error.message}
        </div>
      `;
    }
  }


  /*
    =====================================================
    DOWNLOAD
    =====================================================
  */

  async function baixarArquivo(
    url,
    fileName
  ) {

    try {

      const response =
        await fetch(url);


      if (!response.ok) {
        throw new Error("Falha no download.");
      }


      const blob =
        await response.blob();


      const blobUrl =
        URL.createObjectURL(blob);


      const link =
        document.createElement("a");


      link.href = blobUrl;

      link.download = fileName;

      document.body.appendChild(link);

      link.click();

      link.remove();

      URL.revokeObjectURL(blobUrl);

    }

    catch (error) {

      console.error(error);

      window.open(
        url,
        "_blank"
      );
    }
  }


  /*
    =====================================================
    COPIAR CÓDIGO
    =====================================================
  */

  function copiarCodigo(codigo) {

    navigator.clipboard
      .writeText(codigo)
      .then(() => {

        alert("Código copiado!");

      });
  }


  /*
    =====================================================
    TAMANHO
    =====================================================
  */

  function formatBytes(bytes) {

    if (!bytes) {
      return "0 B";
    }

    const units = [
      "B",
      "KB",
      "MB",
      "GB",
      "TB"
    ];

    const index =
      Math.floor(
        Math.log(bytes) /
        Math.log(1024)
      );

    return (
      parseFloat(
        (
          bytes /
          Math.pow(1024, index)
        ).toFixed(2)
      )
      + " "
      + units[index]
    );
  }


  /*
    =====================================================
    SEGURANÇA
    =====================================================
  */

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  function escapeAttribute(text) {

    return String(text)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }


  /*
    =====================================================
    QR CODE AUTOMÁTICO
    =====================================================
  */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const codigoUrl =
    params.get("code");


  if (codigoUrl) {

    document
      .getElementById("codeInput")
      .value =
        codigoUrl.toUpperCase();


    setTimeout(() => {

      buscarArquivo();

    }, 500);
  }

</script>

</body>
</html>
