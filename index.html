<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Transfer Files</title>


  <!--
    Biblioteca do Supabase
  -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <!--
    Biblioteca para gerar QR Code
  -->

  <script
    src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background: #0f0f12;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

    }


    .container {

      width: 100%;

      max-width: 520px;

      text-align: center;

    }


    h1 {

      margin: 0;

      font-size: 42px;

    }


    .subtitle {

      margin:
        12px
        0
        30px;

      color: #999;

      line-height: 1.5;

    }


    .upload-area {

      display: block;

      padding:
        45px
        20px;

      border:
        2px
        dashed
        #444;

      border-radius: 20px;

      cursor: pointer;

      transition: 0.2s;

    }


    .upload-area:hover {

      border-color:
        #8b5cf6;

      background:
        #15151b;

    }


    .upload-icon {

      font-size: 55px;

      margin-bottom: 15px;

    }


    .upload-text {

      margin-bottom: 20px;

      font-size: 18px;

      font-weight: bold;

    }


    .select-button {

      display:
        inline-block;

      padding:
        14px
        25px;

      border-radius: 12px;

      background:
        #8b5cf6;

      font-weight: bold;

    }


    input[type="file"] {

      display: none;

    }


    #fileInfo {

      display: none;

      margin-top: 20px;

      padding: 18px;

      border-radius: 14px;

      background: #18181d;

      text-align: left;

      word-break: break-word;

    }


    #sendButton {

      display: none;

      width: 100%;

      margin-top: 15px;

      padding: 16px;

      border: 0;

      border-radius: 12px;

      background: #8b5cf6;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    #sendButton:hover {

      background:
        #7446d8;

    }


    #sendButton:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    #status {

      min-height: 25px;

      margin-top: 20px;

      color: #aaa;

    }


    .success {

      color:
        #22c55e !important;

    }


    .error {

      color:
        #ef4444 !important;

    }


    .panel {

      margin-top: 25px;

      padding: 20px;

      border-radius: 16px;

      background:
        #18181d;

    }


    #resultBox {

      display: none;

    }


    .code {

      margin:
        15px
        0;

      padding: 15px;

      border-radius: 12px;

      background:
        #0f0f12;

      font-size: 30px;

      font-weight: bold;

      letter-spacing: 5px;

      user-select: all;

    }


    #qrcode {

      width: 230px;

      height: 230px;

      margin:
        20px
        auto;

      padding: 10px;

      background: white;

      border-radius: 12px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    #qrcode img {

      display: block;

      margin: auto;

    }


    .download-button {

      width: 100%;

      margin-top: 10px;

      padding: 14px;

      border: 0;

      border-radius: 12px;

      background:
        #22c55e;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    .download-button:hover {

      background:
        #16a34a;

    }


    .download-button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    .copy-button {

      width: 100%;

      margin-top: 10px;

      padding: 12px;

      border:
        1px
        solid
        #444;

      border-radius: 10px;

      background:
        transparent;

      color: white;

      cursor: pointer;

    }


    .divider {

      display: flex;

      align-items: center;

      gap: 10px;

      margin:
        30px
        0;

      color: #666;

    }


    .divider::before,
    .divider::after {

      content: "";

      flex: 1;

      height: 1px;

      background: #333;

    }


    .code-input {

      width: 100%;

      padding: 15px;

      border:
        1px
        solid
        #444;

      border-radius: 12px;

      outline: none;

      background:
        #0f0f12;

      color: white;

      text-align: center;

      font-size: 20px;

      font-weight: bold;

      letter-spacing: 4px;

      text-transform: uppercase;

    }


    .code-input:focus {

      border-color:
        #8b5cf6;

    }


    .find-button {

      width: 100%;

      margin-top: 10px;

      padding: 15px;

      border: 0;

      border-radius: 12px;

      background:
        #8b5cf6;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    .find-button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    #foundBox {

      display: none;

    }


    .file-name {

      font-size: 18px;

      font-weight: bold;

      word-break: break-word;

    }


    .file-details {

      margin-top: 10px;

      color: #999;

      line-height: 1.6;

    }

  </style>

</head>


<body>


  <main class="container">


    <h1>
      Transfer Files
    </h1>


    <p class="subtitle">

      Envie um arquivo de um dispositivo<br>

      e baixe exatamente o mesmo arquivo em outro.

    </p>


    <!--
      ==========================================
      ENVIAR
      ==========================================
    -->


    <label class="upload-area">

      <div class="upload-icon">
        📁
      </div>


      <div class="upload-text">
        Escolha um arquivo
      </div>


      <div class="select-button">
        Selecionar arquivo
      </div>


      <input
        type="file"
        id="fileInput">

    </label>


    <div id="fileInfo"></div>


    <button
      id="sendButton">

      📤 Enviar arquivo

    </button>


    <div id="status"></div>


    <!--
      ==========================================
      RESULTADO DO ENVIO
      ==========================================
    -->


    <div
      id="resultBox"
      class="panel">


      <strong>
        ✅ Arquivo enviado!
      </strong>


      <p>
        Escaneie este QR Code no outro dispositivo:
      </p>


      <div id="qrcode"></div>


      <p>
        Ou digite este código:
      </p>


      <div
        id="transferCode"
        class="code">
      </div>


      <button
        id="copyLinkButton"
        class="copy-button">

        🔗 Copiar link de transferência

      </button>


    </div>


    <!--
      ==========================================
      ENCONTRAR ARQUIVO
      ==========================================
    -->


    <div class="divider">
      ou
    </div>


    <div class="panel">


      <strong>
        📥 Receber arquivo
      </strong>


      <p>
        Digite o código recebido:
      </p>


      <input
        id="codeInput"
        class="code-input"
        maxlength="8"
        placeholder="XXXXXXXX"
        autocomplete="off">


      <button
        id="findButton"
        class="find-button">

        🔍 Encontrar arquivo

      </button>


    </div>


    <div
      id="foundBox"
      class="panel">


      <div class="file-name"
        id="foundFileName">
      </div>


      <div
        class="file-details"
        id="foundFileDetails">
      </div>


      <button
        id="downloadFoundButton"
        class="download-button">

        📥 Baixar arquivo

      </button>


    </div>


  </main>


  <script>


    /*
     * ==========================================
     * SUPABASE
     * ==========================================
     */


    const SUPABASE_URL =
      "https://rmplwgtizbqzmvabrbhe.supabase.co";


    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtcGx3Z3RpemJxem12YWJyYmhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMDI5NzIsImV4cCI6MjEwNTY3ODk3Mn0.1Y23eINegprxaFa-HtttbJZsMgrT-Wmq1heTT54YaCw";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /*
     * ==========================================
     * ELEMENTOS
     * ==========================================
     */


    const fileInput =
      document.getElementById(
        "fileInput"
      );


    const fileInfo =
      document.getElementById(
        "fileInfo"
      );


    const sendButton =
      document.getElementById(
        "sendButton"
      );


    const status =
      document.getElementById(
        "status"
      );


    const resultBox =
      document.getElementById(
        "resultBox"
      );


    const transferCode =
      document.getElementById(
        "transferCode"
      );


    const qrcode =
      document.getElementById(
        "qrcode"
      );


    const copyLinkButton =
      document.getElementById(
        "copyLinkButton"
      );


    const codeInput =
      document.getElementById(
        "codeInput"
      );


    const findButton =
      document.getElementById(
        "findButton"
      );


    const foundBox =
      document.getElementById(
        "foundBox"
      );


    const foundFileName =
      document.getElementById(
        "foundFileName"
      );


    const foundFileDetails =
      document.getElementById(
        "foundFileDetails"
      );


    const downloadFoundButton =
      document.getElementById(
        "downloadFoundButton"
      );


    let selectedFile = null;

    let downloadUrl = null;

    let originalFileName = null;

    let currentTransferLink = null;

    let foundDownloadUrl = null;

    let foundFileNameValue = null;


    /*
     * ==========================================
     * TAMANHO
     * ==========================================
     */


    function formatSize(size) {

      if (size < 1024) {

        return size + " B";

      }


      if (
        size <
        1024 * 1024
      ) {

        return (
          size / 1024
        ).toFixed(2) + " KB";

      }


      if (
        size <
        1024 * 1024 * 1024
      ) {

        return (
          size /
          1024 /
          1024
        ).toFixed(2) + " MB";

      }


      return (
        size /
        1024 /
        1024 /
        1024
      ).toFixed(2) + " GB";

    }


    /*
     * ==========================================
     * SELECIONAR ARQUIVO
     * ==========================================
     */


    fileInput.addEventListener(
      "change",
      function () {

        selectedFile =
          fileInput.files[0];


        if (!selectedFile) {
          return;
        }


        fileInfo.innerHTML = `

          <strong>
            ${escapeHtml(
              selectedFile.name
            )}
          </strong>

          <br><br>

          Tamanho:
          ${formatSize(
            selectedFile.size
          )}

          <br>

          Tipo:
          ${escapeHtml(
            selectedFile.type ||
            "desconhecido"
          )}

        `;


        fileInfo.style.display =
          "block";


        sendButton.style.display =
          "block";


        sendButton.disabled =
          false;


        sendButton.textContent =
          "📤 Enviar arquivo";


        resultBox.style.display =
          "none";


        status.textContent =
          "Arquivo pronto para envio.";

        status.className = "";

      }
    );


    /*
     * ==========================================
     * ENVIAR
     * ==========================================
     */


    sendButton.addEventListener(
      "click",
      async function () {


        if (!selectedFile) {
          return;
        }


        sendButton.disabled =
          true;


        sendButton.textContent =
          "⏳ Enviando...";


        status.textContent =
          "Enviando arquivo...";

        status.className = "";


        try {


          /*
           * ID
           */


          const id =
            crypto.randomUUID();


          /*
           * CÓDIGO
           */


          const codigo =
            id
              .replaceAll("-", "")
              .substring(0, 8)
              .toUpperCase();


          /*
           * CAMINHO
           */


          const caminho =
            id +
            "/" +
            selectedFile.name;


          console.log(
            "Enviando:",
            caminho
          );


          /*
           * UPLOAD
           */


          const upload =
            await supabaseClient
              .storage
              .from("files")
              .upload(
                caminho,
                selectedFile,
                {
                  cacheControl:
                    "3600",

                  upsert:
                    false,

                  contentType:
                    selectedFile.type ||
                    "application/octet-stream"
                }
              );


          if (upload.error) {

            throw upload.error;

          }


          /*
           * SALVA INFORMAÇÕES
           * NA TABELA
           */


          const database =
            await supabaseClient
              .from("transfers")
              .insert({

                code:
                  codigo,

                file_path:
                  caminho,

                file_name:
                  selectedFile.name,

                file_type:
                  selectedFile.type ||
                  "application/octet-stream",

                file_size:
                  selectedFile.size

              });


          if (database.error) {

            throw database.error;

          }


          /*
           * LINK DA PÁGINA
           */


          const pageUrl =
            window.location.origin +
            window.location.pathname +
            "?code=" +
            codigo;


          currentTransferLink =
            pageUrl;


          originalFileName =
            selectedFile.name;


          /*
           * MOSTRA CÓDIGO
           */


          transferCode.textContent =
            codigo;


          /*
           * LIMPA QR ANTERIOR
           */


          qrcode.innerHTML =
            "";


          /*
           * GERA QR
           */


          new QRCode(
            qrcode,
            {
              text:
                pageUrl,

              width:
                210,

              height:
                210,

              correctLevel:
                QRCode.CorrectLevel.M
            }
          );


          /*
           * MOSTRA RESULTADO
           */


          resultBox.style.display =
            "block";


          status.textContent =
            "✅ Arquivo enviado com sucesso!";


          status.className =
            "success";


          sendButton.textContent =
            "✅ Enviado";


          console.log(
            "Código:",
            codigo
          );


          console.log(
            "Link:",
            pageUrl
          );


        } catch (error) {


          console.error(
            "Erro:",
            error
          );


          status.textContent =
            "❌ " +
            (
              error.message ||
              "Erro desconhecido"
            );


          status.className =
            "error";


          sendButton.disabled =
            false;


          sendButton.textContent =
            "📤 Enviar arquivo";

        }

      }
    );


    /*
     * ==========================================
     * COPIAR LINK
     * ==========================================
     */


    copyLinkButton.addEventListener(
      "click",
      async function () {


        if (!currentTransferLink) {
          return;
        }


        try {


          await navigator.clipboard.writeText(
            currentTransferLink
          );


          copyLinkButton.textContent =
            "✅ Link copiado!";


          setTimeout(
            function () {

              copyLinkButton.textContent =
                "🔗 Copiar link";

            },
            2000
          );


        } catch (error) {


          alert(
            "Não foi possível copiar."
          );

        }

      }
    );


    /*
     * ==========================================
     * ENCONTRAR POR CÓDIGO
     * ==========================================
     */


    findButton.addEventListener(
      "click",
      encontrarArquivo
    );


    /*
     * ENTER NO CAMPO
     */


    codeInput.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter"
        ) {

          encontrarArquivo();

        }

      }
    );


    /*
     * ==========================================
     * FUNÇÃO ENCONTRAR
     * ==========================================
     */


    async function encontrarArquivo() {


      const codigo =
        codeInput.value
          .trim()
          .toUpperCase();


      if (!codigo) {


        status.textContent =
          "Digite um código.";

        status.className =
          "error";


        return;

      }


      findButton.disabled =
        true;


      findButton.textContent =
        "⏳ Procurando...";


      foundBox.style.display =
        "none";


      status.textContent =
        "Procurando arquivo...";

      status.className = "";


      try {


        /*
         * BUSCA NO BANCO
         */


        const resultado =
          await supabaseClient
            .from("transfers")
            .select(
              "file_path,file_name,file_type,file_size"
            )
            .eq(
              "code",
              codigo
            )
            .maybeSingle();


        if (resultado.error) {

          throw resultado.error;

        }


        if (!resultado.data) {

          throw new Error(
            "Código não encontrado."
          );

        }


        const arquivo =
          resultado.data;


        /*
         * GERA LINK TEMPORÁRIO
         */


        const signed =
          await supabaseClient
            .storage
            .from("files")
            .createSignedUrl(
              arquivo.file_path,
              86400
            );


        if (signed.error) {

          throw signed.error;

        }


        foundDownloadUrl =
          signed.data.signedUrl;


        foundFileNameValue =
          arquivo.file_name;


        /*
         * MOSTRA INFORMAÇÕES
         */


        foundFileName.textContent =
          "📄 " +
          arquivo.file_name;


        foundFileDetails.innerHTML = `

          Tamanho:
          ${formatSize(
            arquivo.file_size || 0
          )}

          <br>

          Tipo:
          ${escapeHtml(
            arquivo.file_type ||
            "desconhecido"
          )}

        `;


        foundBox.style.display =
          "block";


        status.textContent =
          "✅ Arquivo encontrado!";

        status.className =
          "success";


      } catch (error) {


        console.error(
          "Erro:",
          error
        );


        status.textContent =
          "❌ " +
          (
            error.message ||
            "Erro desconhecido"
          );


        status.className =
          "error";

      }


      findButton.disabled =
        false;


      findButton.textContent =
        "🔍 Encontrar arquivo";

    }


    /*
     * ==========================================
     * DOWNLOAD DO ARQUIVO ENCONTRADO
     * ==========================================
     */


    downloadFoundButton.addEventListener(
      "click",
      async function () {


        if (!foundDownloadUrl) {
          return;
        }


        downloadFoundButton.disabled =
          true;


        downloadFoundButton.textContent =
          "⏳ Baixando...";


        try {


          /*
           * PEGA OS BYTES
           */


          const resposta =
            await fetch(
              foundDownloadUrl
            );


          if (!resposta.ok) {

            throw new Error(
              "Falha no download."
            );

          }


          const blob =
            await resposta.blob();


          /*
           * DOWNLOAD LOCAL
           */


          const blobUrl =
            URL.createObjectURL(
              blob
            );


          const link =
            document.createElement(
              "a"
            );


          link.href =
            blobUrl;


          link.download =
            foundFileNameValue ||
            "arquivo";


          document.body.appendChild(
            link
          );


          link.click();


          link.remove();


          setTimeout(
            function () {

              URL.revokeObjectURL(
                blobUrl
              );

            },
            1000
          );


          downloadFoundButton.textContent =
            "✅ Baixado!";


        } catch (error) {


          console.error(
            "Erro no download:",
            error
          );


          window.open(
            foundDownloadUrl,
            "_blank"
          );


          downloadFoundButton.textContent =
            "📥 Baixar arquivo";

        }


        setTimeout(
          function () {

            downloadFoundButton.disabled =
              false;

            downloadFoundButton.textContent =
              "📥 Baixar arquivo";

          },
          2000
        );

      }
    );


    /*
     * ==========================================
     * QR AUTOMÁTICO
     *
     * Se abrir:
     *
     * site.com/?code=ABCDEFGH
     *
     * o campo já recebe o código.
     * ==========================================
     */


    window.addEventListener(
      "DOMContentLoaded",
      function () {


        const parametros =
          new URLSearchParams(
            window.location.search
          );


        const codigo =
          parametros.get(
            "code"
          );


        if (codigo) {


          codeInput.value =
            codigo.toUpperCase();


          /*
           * Pequeno atraso para
           * deixar a página carregar.
           */


          setTimeout(
            function () {

              encontrarArquivo();

            },
            500
          );

        }

      }
    );


    /*
     * ==========================================
     * SEGURANÇA
     * ==========================================
     */


    function escapeHtml(text) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text;


      return div.innerHTML;

    }


    console.log(
      "Transfer Files iniciado."
    );

  </script>

</body>

</html>
