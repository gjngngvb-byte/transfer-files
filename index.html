<body>

  <div class="container">

    <header>

      <div class="logo">
        📁
      </div>

      <h1>Transfer Files</h1>

      <div class="subtitle">
        Envie arquivos de um dispositivo para outro
      </div>

    </header>


    <!-- ENVIAR -->

    <div class="box">

      <h2>Enviar arquivo</h2>

      <div class="description">
        Selecione um arquivo para gerar um código de transferência.
      </div>

      <input
        type="file"
        id="fileInput"
      >

      <div
        id="senderPreview"
        class="preview hidden"
      ></div>

      <button onclick="enviarArquivo()">
        Enviar arquivo
      </button>

      <div id="uploadResult"></div>

    </div>


    <!-- RECEBER -->

    <div class="box">

      <h2>Receber arquivo</h2>

      <div class="description">
        Digite o código recebido ou abra o link do QR Code.
      </div>

      <input
        type="text"
        id="codeInput"
        maxlength="8"
        placeholder="CÓDIGO"
      >

      <button onclick="buscarArquivo()">
        Encontrar arquivo
      </button>

      <div id="foundBox"></div>

    </div>

  </div>


<script>

  const SUPABASE_URL = "https://rmplwgtizbqzmvabrbhe.supabase.co";

  /*
    MANTENHA A MESMA SUPABASE_KEY
    QUE JÁ ESTÁ FUNCIONANDO NO SEU ARQUIVO ATUAL.
  */

  const SUPABASE_KEY = "SUA_CHAVE_ANON_PUBLIC_AQUI";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  let selectedFile = null;
  let localPreviewUrl = null;


  /*
    =====================================================
    PRÉ-VISUALIZAÇÃO DO ARQUIVO SELECIONADO
    =====================================================
  */

  document
    .getElementById("fileInput")
    .addEventListener("change", function () {

      selectedFile = this.files[0];

      if (!selectedFile) {
        return;
      }

      mostrarPreviewLocal(selectedFile);
    });


  function mostrarPreviewLocal(file) {

    const container =
      document.getElementById("senderPreview");

    if (localPreviewUrl) {

      URL.revokeObjectURL(localPreviewUrl);

      localPreviewUrl = null;
    }

    container.innerHTML = "";

    container.classList.remove("hidden");

    const titulo =
      document.createElement("div");

    titulo.className = "preview-title";

    titulo.innerHTML =
      "👁️ Pré-visualização";

    container.appendChild(titulo);

    localPreviewUrl =
      URL.createObjectURL(file);

    criarElementoPreview(
      container,
      localPreviewUrl,
      file.type,
      file.name
    );
  }


  /*
    =====================================================
    CRIA O PREVIEW
    =====================================================
  */

  function criarElementoPreview(
    container,
    url,
    type,
    fileName
  ) {

    if (type.startsWith("image/")) {

      const img =
        document.createElement("img");

      img.src = url;
      img.alt = fileName;

      container.appendChild(img);

      return;
    }


    if (type === "application/pdf") {

      const iframe =
        document.createElement("iframe");

      iframe.src = url;
      iframe.title = fileName;

      container.appendChild(iframe);

      return;
    }


    if (type.startsWith("video/")) {

      const video =
        document.createElement("video");

      video.src = url;
      video.controls = true;

      container.appendChild(video);

      return;
    }


    if (type.startsWith("audio/")) {

      const audio =
        document.createElement("audio");

      audio.src = url;
      audio.controls = true;

      container.appendChild(audio);

      return;
    }


    if (
      type === "text/plain" ||
      type === "text/csv"
    ) {

      const pre =
        document.createElement("pre");

      fetch(url)
        .then(response => response.text())
        .then(text => {

          pre.textContent = text;

        })
        .catch(() => {

          pre.textContent =
            "Não foi possível visualizar este arquivo.";

        });

      container.appendChild(pre);

      return;
    }


    const mensagem =
      document.createElement("div");

    mensagem.style.padding = "30px 10px";

    mensagem.style.color = "#8c929f";

    mensagem.innerHTML = `
      <div style="font-size:28px;margin-bottom:10px">
        📦
      </div>

      <strong style="color:#e7e9ee">
        Prévia não disponível
      </strong>

      <br><br>

      Este tipo de arquivo precisa ser baixado
      para ser aberto.
    `;

    container.appendChild(mensagem);
  }


  /*
    =====================================================
    ENVIAR ARQUIVO
    =====================================================
  */

  async function enviarArquivo() {

    const result =
      document.getElementById("uploadResult");

    result.innerHTML = "";

    if (!selectedFile) {

      result.innerHTML =
        '<div class="error">Selecione um arquivo primeiro.</div>';

      return;
    }

    result.innerHTML =
      '<div style="margin-top:14px;color:#8c929f">Enviando arquivo...</div>';


    try {

      const id =
        crypto.randomUUID();

      const filePath =
        id + "/" + selectedFile.name;


      const {
        error: uploadError
      } =
        await supabaseClient.storage
          .from("files")
          .upload(
            filePath,
            selectedFile,
            {
              contentType:
                selectedFile.type ||
                "application/octet-stream",

              upsert: false
            }
          );


      if (uploadError) {
        throw uploadError;
      }


      const codigo =
        id
          .replace(/-/g, "")
          .substring(0, 8)
          .toUpperCase();


      const {
        error: databaseError
      } =
        await supabaseClient
          .from("transfers")
          .insert({
            code: codigo,
            file_path: filePath,
            file_name: selectedFile.name,
            file_type:
              selectedFile.type ||
              "application/octet-stream",
            file_size: selectedFile.size
          });


      if (databaseError) {
        throw databaseError;
      }


      const pageUrl =
        window.location.origin +
        window.location.pathname +
        "?code=" +
        codigo;


      result.innerHTML = `

        <div class="info">

          <div class="success">
            ✓ Arquivo enviado com sucesso
          </div>

          <div
            style="
              margin-top:18px;
              color:#8c929f;
              font-size:12px;
              text-transform:uppercase;
              letter-spacing:1px;
            "
          >
            Código de transferência
          </div>

          <div class="code">
            ${codigo}
          </div>

          <div id="qrcode"></div>

          <button
            class="secondary"
            onclick="copiarCodigo('${codigo}')"
          >
            Copiar código
          </button>

        </div>
      `;


      new QRCode(
        document.getElementById("qrcode"),
        {
          text: pageUrl,
          width: 220,
          height: 220
        }
      );

    }

    catch (error) {

      console.error(error);

      result.innerHTML = `
        <div class="error">
          Erro ao enviar arquivo:
          <br>
          ${error.message}
        </div>
      `;
    }
  }


  /*
    =====================================================
    BUSCAR ARQUIVO
    =====================================================
  */

  async function buscarArquivo() {

    const codigo =
      document
        .getElementById("codeInput")
        .value
        .trim()
        .toUpperCase();


    const foundBox =
      document.getElementById("foundBox");


    foundBox.innerHTML =
      '<div style="margin-top:14px;color:#8c929f">Procurando arquivo...</div>';


    if (!codigo) {

      foundBox.innerHTML =
        '<div class="error">Digite um código.</div>';

      return;
    }


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("transfers")
          .select("*")
          .eq("code", codigo)
          .single();


      if (error || !data) {

        foundBox.innerHTML =
          '<div class="error">Arquivo não encontrado.</div>';

        return;
      }


      const {
        data: signedData,
        error: signedError
      } =
        await supabaseClient.storage
          .from("files")
          .createSignedUrl(
            data.file_path,
            86400
          );


      if (signedError) {
        throw signedError;
      }


      const signedUrl =
        signedData.signedUrl;


      foundBox.innerHTML = `

        <div class="info">

          <strong>
            ${escapeHtml(data.file_name)}
          </strong>

          <div
            style="
              margin-top:7px;
              color:#777e8a;
              font-size:12px;
            "
          >
            ${formatBytes(data.file_size)}
          </div>

          <div
            id="remotePreview"
            class="preview"
          >

            <div class="preview-title">
              👁️ Pré-visualização
            </div>

          </div>

          <button
            class="download"
            onclick="baixarArquivo(
              '${escapeAttribute(signedUrl)}',
              '${escapeAttribute(data.file_name)}'
            )"
          >
            ⬇️ Baixar arquivo
          </button>

        </div>
      `;


      const preview =
        document.getElementById(
          "remotePreview"
        );


      criarElementoPreview(
        preview,
        signedUrl,
        data.file_type || "",
        data.file_name
      );

    }

    catch (error) {

      console.error(error);

      foundBox.innerHTML = `
        <div class="error">
          Erro ao encontrar arquivo:
          <br>
          ${error.message}
        </div>
      `;
    }
  }


  /*
    =====================================================
    DOWNLOAD
    =====================================================
  */

  async function baixarArquivo(
    url,
    fileName
  ) {

    try {

      const response =
        await fetch(url);


      if (!response.ok) {
        throw new Error("Falha no download.");
      }


      const blob =
        await response.blob();


      const blobUrl =
        URL.createObjectURL(blob);


      const link =
        document.createElement("a");


      link.href = blobUrl;

      link.download = fileName;

      document.body.appendChild(link);

      link.click();

      link.remove();

      URL.revokeObjectURL(blobUrl);

    }

    catch (error) {

      console.error(error);

      window.open(
        url,
        "_blank"
      );
    }
  }


  /*
    =====================================================
    COPIAR CÓDIGO
    =====================================================
  */

  function copiarCodigo(codigo) {

    navigator.clipboard
      .writeText(codigo)
      .then(() => {

        alert("Código copiado!");

      });
  }


  /*
    =====================================================
    TAMANHO
    =====================================================
  */

  function formatBytes(bytes) {

    if (!bytes) {
      return "0 B";
    }

    const units = [
      "B",
      "KB",
      "MB",
      "GB",
      "TB"
    ];

    const index =
      Math.floor(
        Math.log(bytes) /
        Math.log(1024)
      );

    return (
      parseFloat(
        (
          bytes /
          Math.pow(1024, index)
        ).toFixed(2)
      )
      + " "
      + units[index]
    );
  }


  /*
    =====================================================
    SEGURANÇA
    =====================================================
  */

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  function escapeAttribute(text) {

    return String(text)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }


  /*
    =====================================================
    QR CODE AUTOMÁTICO
    =====================================================
  */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const codigoUrl =
    params.get("code");


  if (codigoUrl) {

    document
      .getElementById("codeInput")
      .value =
        codigoUrl.toUpperCase();


    setTimeout(() => {

      buscarArquivo();

    }, 500);
  }

</script>

</body>
</html>
